name: Patch pregame storage wiring

on:
  push:
    branches:
      - refactor/modularize-storage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-storage
          fetch-depth: 0

      - name: Extract pregame persistence from app.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '# =========================================================\n# HAWKS AI 試合前予測 固定保存\n# =========================================================\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Pregame start marker not found; refusing unsafe edit')

          next_marker = '# ========================================================='
          search_from = start + len(start_marker)
          end = text.find(next_marker, search_from)
          if end < 0:
              raise SystemExit('Pregame end marker not found; refusing unsafe edit')

          replacement = '''# =========================================================
          # HAWKS AI 試合前予測 固定保存
          # =========================================================
          from storage.pregame_predictions import (
              get_pregame_probability as _get_pregame_probability,
              load_pregame_predictions as _load_pregame_predictions,
              save_pregame_prediction as _save_pregame_prediction,
          )

          PREGAME_PREDICTION_FILE = DATA_DIR / "pregame_predictions.json"


          def load_pregame_predictions():
              return _load_pregame_predictions(PREGAME_PREDICTION_FILE)


          def save_pregame_prediction(date_value, opponent, probability_value, model="V8 FINAL"):
              return _save_pregame_prediction(
                  PREGAME_PREDICTION_FILE,
                  date_value,
                  opponent,
                  probability_value,
                  model,
              )


          def get_pregame_probability(date_value, opponent):
              return _get_pregame_probability(PREGAME_PREDICTION_FILE, date_value, opponent)


          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          )
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile app.py bet_manager.py storage/*.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pregame-storage.yml
          git add app.py
          git diff --cached --check
          git commit -m "Wire app pregame predictions to storage module"
          git push origin HEAD:refactor/modularize-storage
