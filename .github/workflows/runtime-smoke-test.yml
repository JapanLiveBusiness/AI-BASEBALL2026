name: Runtime smoke test

on:
  push:
    branches:
      - main-AI-BASEBALL
      - private-analytics-only
      - refactor/**
  pull_request:
    branches:
      - main-AI-BASEBALL
      - private-analytics-only

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax check
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile *.py
          find pages scripts -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile
          if [ -d storage ]; then find storage -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile; fi
          if [ -d ui ]; then find ui -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile; fi

      - name: Verify internal page targets exist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          missing = []
          targets = []
          for path in [root / 'main.py', root / 'studio_theme.py', *sorted((root / 'pages').glob('*.py'))]:
              text = path.read_text(encoding='utf-8')
              for target in re.findall(r'st\.page_link\(["\']([^"\']+)["\']', text):
                  targets.append((path, target))
              for target in re.findall(r'st\.switch_page\(["\']([^"\']+)["\']', text):
                  targets.append((path, target))
          for source, target in targets:
              if not (root / target).exists():
                  missing.append(f'{source}: {target}')
          if missing:
              raise SystemExit('Missing page targets:\n' + '\n'.join(missing))
          print(f'Checked {len(targets)} page targets')
          PY

      - name: Guard game page HTML rendering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('pages/試合.py')
          text = path.read_text(encoding='utf-8')
          errors = []

          if 'st.html(page_html)' not in text:
              errors.append('pages/試合.py must render the composed game page with st.html(page_html)')
          if 'st.markdown(feature_html' in text:
              errors.append('pages/試合.py must not render feature_html with st.markdown; it can expose raw HTML')
          if 'from research_state import current_slate' not in text:
              errors.append('pages/試合.py must use the shared current_slate state')
          if 'prediction_for_display(display_date)' not in text:
              errors.append('pages/試合.py must use date-matched AI predictions')

          if errors:
              raise SystemExit('\n'.join(errors))
          print('Game page HTML rendering guard passed')
          PY

      - name: Build Docker image
        run: docker build -t ai-baseball2026-smoke .

      - name: Start container
        run: docker run -d --name ai-baseball2026-smoke -p 8501:8501 ai-baseball2026-smoke

      - name: Wait for Streamlit health endpoint
        shell: bash
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs ai-baseball2026-smoke
          exit 1

      - name: Verify app HTTP response
        run: curl -fsS http://127.0.0.1:8501/ >/dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker logs ai-baseball2026-smoke || true
