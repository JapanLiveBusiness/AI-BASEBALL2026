name: Patch modular storage wiring

on:
  push:
    branches:
      - refactor/modularize-storage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modularize-storage
          fetch-depth: 0

      - name: Replace game history block with storage wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          start_marker = '# ===== HAWKS AI 試合履歴 永続保存 =====\n'
          end_marker = '\n\n\ncomponents.html('

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Start marker not found; refusing unsafe edit')

          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('End marker not found; refusing unsafe edit')

          replacement = '''# ===== HAWKS AI 試合履歴 永続保存 =====
          from storage.game_history import (
              load_game_history as _load_game_history,
              save_game_history as _save_game_history,
          )

          DATA_DIR = Path(__file__).resolve().parent / "data"
          DATA_DIR.mkdir(parents=True, exist_ok=True)
          HISTORY_PATH = DATA_DIR / "game_history.json"


          def load_game_history():
              return _load_game_history(HISTORY_PATH)


          def save_game_history(game):
              _save_game_history(HISTORY_PATH, game)
          '''
          replacement = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in replacement.splitlines()
          )

          new_text = text[:start] + replacement + text[end:]
          path.write_text(new_text, encoding='utf-8')
          print('Patched app.py game history persistence block')
          PY

      - name: Syntax check
        run: python -m py_compile app.py storage/__init__.py storage/json_store.py storage/game_history.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-modular-storage.yml
          git add app.py
          git diff --cached --check
          git commit -m "Wire app game history to storage module"
          git push origin HEAD:refactor/modularize-storage
