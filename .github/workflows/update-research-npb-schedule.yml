name: Update research NPB schedule

on:
  push:
    branches:
      - main-AI-BASEBALL
    paths:
      - ".github/workflows/update-research-npb-schedule.yml"
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
    - cron: "0 6 * * *"  # 15:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-research-npb-schedule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RESEARCH_BRANCH: private-analytics-only

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: private-analytics-only
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schedule dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch current or next official NPB slate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_npb_schedule.py --output data/npb_today.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/npb_today.json").read_text(encoding="utf-8"))
          games = payload.get("games") or []
          if not payload.get("date"):
              raise SystemExit("generated schedule has no date")
          if not games:
              raise SystemExit("generated schedule has no games")
          if payload.get("count") != len(games):
              raise SystemExit("generated schedule count does not match games")
          print(f"schedule date={payload['date']} games={len(games)}")
          PY

      - name: Save schedule snapshot to research branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/npb_today.json; then
            echo "No repository schedule change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/npb_today.json
          git commit -m "Update official NPB schedule"
          git push origin HEAD:"$RESEARCH_BRANCH"

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not available to this workflow"
              missing=1
            fi
          done
          exit "$missing"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          timeout: 1m

      - name: Resolve server-01
        shell: bash
        run: |
          set -euo pipefail
          resolved=""
          for attempt in $(seq 1 12); do
            resolved="$(tailscale status --json | jq -r '
              [.Peer[] | select(.HostName == "server-01" and .Online == true) | (.TailscaleIPs // [])[0]]
              | map(select(. != null)) | .[0] // empty
            ')"
            [ -n "$resolved" ] && break
            sleep 5
          done
          if [ -z "$resolved" ]; then
            echo "::error::server-01 is not visible as an online Tailscale peer"
            exit 1
          fi
          nc -vz -w 10 "$resolved" "$DEPLOY_PORT"
          echo "DEPLOY_HOST_RESOLVED=$resolved" >> "$GITHUB_ENV"

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

      - name: Publish schedule to research data volume
        shell: bash
        run: |
          set -euo pipefail
          COMMON_OPTS=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
          )
          scp -P "$DEPLOY_PORT" "${COMMON_OPTS[@]}" data/npb_today.json "$DEPLOY_USER@$DEPLOY_HOST_RESOLVED:/tmp/npb_today.json"
          ssh -p "$DEPLOY_PORT" "${COMMON_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST_RESOLVED" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DATA_DIR="/opt/hawks-ai/research-data"
          mkdir -p "$DATA_DIR"
          install -m 0644 /tmp/npb_today.json "$DATA_DIR/npb_today.json.tmp"
          mv "$DATA_DIR/npb_today.json.tmp" "$DATA_DIR/npb_today.json"
          rm -f /tmp/npb_today.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/opt/hawks-ai/research-data/npb_today.json").read_text(encoding="utf-8"))
          games = payload.get("games") or []
          if not payload.get("date") or not games:
              raise SystemExit("remote schedule verification failed")
          print(f"remote schedule date={payload['date']} games={len(games)}")
          PY
          curl -fsS --max-time 15 http://127.0.0.1:8502/_stcore/health
          REMOTE
