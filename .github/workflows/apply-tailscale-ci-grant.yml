name: Apply Tailscale CI grant

on:
  push:
    branches:
      - main-AI-BASEBALL
    paths:
      - .github/workflows/apply-tailscale-ci-grant.yml

permissions:
  contents: read

jobs:
  apply-grant:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
    steps:
      - name: Safely add tag:ci to server-01 TCP 22 grant
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$TS_OAUTH_CLIENT_ID" ] || [ -z "$TS_OAUTH_SECRET" ]; then
            echo "::error::TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET are required"
            exit 1
          fi

          token_json="$(curl --fail-with-body --silent --show-error \
            -d "client_id=$TS_OAUTH_CLIENT_ID" \
            -d "client_secret=$TS_OAUTH_SECRET" \
            https://api.tailscale.com/api/v2/oauth/token)"
          token="$(jq -r '.access_token // empty' <<<"$token_json")"
          scope="$(jq -r '.scope // ""' <<<"$token_json")"

          if [ -z "$token" ]; then
            echo "::error::Tailscale OAuth token exchange did not return an access token"
            exit 1
          fi

          case " $scope " in
            *" policy_file "*|*" acl "*|*" all "*) ;;
            *)
              echo "::error::OAuth client does not have policy_file (or legacy acl/all) scope; no tailnet policy change was attempted"
              exit 78
              ;;
          esac

          devices_code="$(curl --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json" \
            -o devices.json \
            -w '%{http_code}' \
            https://api.tailscale.com/api/v2/tailnet/-/devices)"
          if [ "$devices_code" != "200" ]; then
            echo "::error::Unable to read tailnet devices with the configured OAuth client (HTTP $devices_code); no policy change was attempted"
            exit 1
          fi

          server_ip="$(jq -r '
            (if type == "array" then . else (.devices // []) end)
            | map(select(
                ((.hostname // "") == "server-01")
                or ((.name // "") == "server-01")
                or ((.name // "") | startswith("server-01."))
              ))
            | .[0].addresses // []
            | map(select(test("^100\\.")))
            | .[0] // empty
          ' devices.json)"
          if [ -z "$server_ip" ]; then
            echo "::error::Could not resolve the current Tailscale IPv4 address for server-01; no policy change was attempted"
            exit 1
          fi
          echo "Resolved the current server-01 device from the Tailscale API."

          policy_code="$(curl --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json" \
            -D policy.headers \
            -o policy.json \
            -w '%{http_code}' \
            https://api.tailscale.com/api/v2/tailnet/-/acl)"
          if [ "$policy_code" != "200" ]; then
            echo "::error::Unable to read the tailnet policy (HTTP $policy_code); no policy change was attempted"
            exit 1
          fi

          if ! jq empty policy.json >/dev/null 2>&1; then
            echo "::error::The tailnet policy is HuJSON rather than strict JSON. Refusing an automated rewrite so comments/formatting are not lost."
            exit 79
          fi

          already_present="$(jq --arg ip "$server_ip" '
            any(.grants[]?;
              (((.src // []) | index("tag:ci")) != null)
              and (((.dst // []) | index($ip)) != null)
              and (((.ip // []) | index("tcp:22")) != null)
            )
          ' policy.json)"
          if [ "$already_present" = "true" ]; then
            echo "Required tag:ci -> server-01 tcp:22 grant is already present."
            exit 0
          fi

          jq --arg ip "$server_ip" '
            .grants = ((.grants // []) + [{
              "src": ["tag:ci"],
              "dst": [$ip],
              "ip": ["tcp:22"]
            }])
          ' policy.json > updated-policy.json

          validate_code="$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @updated-policy.json \
            -o validate-response.txt \
            -w '%{http_code}' \
            https://api.tailscale.com/api/v2/tailnet/-/acl/validate)"
          if [ "$validate_code" != "200" ] && [ "$validate_code" != "204" ]; then
            echo "::error::Tailscale rejected the proposed policy during validation (HTTP $validate_code); no policy change was applied"
            sed -n '1,20p' validate-response.txt || true
            exit 1
          fi

          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/\r$/, "", $2); print $2}' policy.headers | tail -n 1)"
          apply_args=(
            --silent --show-error
            -X POST
            -H "Authorization: Bearer $token"
            -H "Content-Type: application/json"
            --data-binary @updated-policy.json
            -o apply-response.txt
            -w '%{http_code}'
          )
          if [ -n "$etag" ]; then
            apply_args+=( -H "If-Match: $etag" )
          fi

          apply_code="$(curl "${apply_args[@]}" https://api.tailscale.com/api/v2/tailnet/-/acl)"
          if [ "$apply_code" != "200" ] && [ "$apply_code" != "204" ]; then
            echo "::error::Tailscale policy update failed (HTTP $apply_code)"
            sed -n '1,20p' apply-response.txt || true
            exit 1
          fi

          verify_code="$(curl --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/json" \
            -o verify-policy.json \
            -w '%{http_code}' \
            https://api.tailscale.com/api/v2/tailnet/-/acl)"
          if [ "$verify_code" != "200" ] || ! jq -e --arg ip "$server_ip" '
            any(.grants[]?;
              (((.src // []) | index("tag:ci")) != null)
              and (((.dst // []) | index($ip)) != null)
              and (((.ip // []) | index("tcp:22")) != null)
            )
          ' verify-policy.json >/dev/null; then
            echo "::error::Policy update returned success but the required grant could not be verified"
            exit 1
          fi

          echo "Verified: tag:ci can reach the current server-01 Tailscale IP on TCP 22 only."
