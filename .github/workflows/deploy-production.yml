name: Deploy production

on:
  push:
    branches:
      - main-AI-BASEBALL
  workflow_dispatch:

concurrency:
  group: production-ai-baseball
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not available to this workflow"
              missing=1
            fi
          done
          if { [ -n "$TS_OAUTH_CLIENT_ID" ] && [ -z "$TS_OAUTH_SECRET" ]; } || { [ -z "$TS_OAUTH_CLIENT_ID" ] && [ -n "$TS_OAUTH_SECRET" ]; }; then
            echo "::error::TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET must be configured together"
            missing=1
          fi
          if [ -z "$TS_OAUTH_CLIENT_ID" ] && [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "::error::Configure TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET or TAILSCALE_AUTHKEY"
            missing=1
          fi
          exit "$missing"

      - name: Connect to Tailscale with OAuth
        id: tailscale_oauth
        if: ${{ env.TS_OAUTH_CLIENT_ID != '' && env.TS_OAUTH_SECRET != '' }}
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Probe production SSH over OAuth
        id: oauth_probe
        if: ${{ steps.tailscale_oauth.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Tailscale status after OAuth connection:"
          tailscale status || true
          echo "Testing configured production address over Tailscale: $DEPLOY_HOST:$DEPLOY_PORT"
          nc -vz -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT"
          timeout 15 bash -c "</dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT"
          echo "DEPLOY_HOST_RESOLVED=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Reset failed OAuth Tailscale session
        if: ${{ steps.oauth_probe.outcome == 'failure' && env.TAILSCALE_AUTHKEY != '' }}
        shell: bash
        run: |
          sudo tailscale logout || true
          sudo pkill tailscaled || true
          sleep 2

      - name: Connect to Tailscale with legacy auth key fallback
        id: tailscale_legacy
        if: ${{ (steps.tailscale_oauth.outcome != 'success' || steps.oauth_probe.outcome == 'failure') && env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Probe production SSH over legacy auth key
        if: ${{ steps.tailscale_legacy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Tailscale status after legacy auth-key connection:"
          tailscale status || true
          nc -vz -w 10 "$DEPLOY_HOST" "$DEPLOY_PORT"
          timeout 15 bash -c "</dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT"
          echo "DEPLOY_HOST_RESOLVED=$DEPLOY_HOST" >> "$GITHUB_ENV"

      - name: Require reachable production host
        shell: bash
        run: |
          if [ -z "${DEPLOY_HOST_RESOLVED:-}" ]; then
            echo "::error::Production SSH host is unreachable through both configured Tailscale authentication paths"
            exit 1
          fi

      - name: Deploy to production server
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST_RESOLVED" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -e
          export APP_DIR="/opt/hawks-ai/ai-baseball2026"
          export DATA_DIR="/opt/hawks-ai/data"
          export BRANCH="main-AI-BASEBALL"
          export CONTAINER_NAME="hawks-app"
          export IMAGE_NAME="hawks-app"
          export PORT="8501"

          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git show "origin/$BRANCH:scripts/deploy-production.sh" > /tmp/ai-baseball-deploy.sh
          chmod +x /tmp/ai-baseball-deploy.sh
          /tmp/ai-baseball-deploy.sh
          REMOTE

      - name: Verify protected public site
        shell: bash
        env:
          SITE_URL: https://ai-baseball.f-polaris.jp/
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/verify-protected-site.sh
